# Builds the website and uploads it to S3 + CloudFront on every push to main.
# AWS sign-in uses OIDC (role created by infra/template.yaml), so no AWS keys are stored in GitHub.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  DEPLOY_ROLE: arn:aws:iam::209186716057:role/empire-of-assassins-GitHubDeployRole-Oiul3Sf9Prel
  BUCKET: empire-of-assassins-sitebucket-nlz1kdocdb32
  DISTRIBUTION: E3CIVZP13LI87V

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build
        env:
          VITE_SERVER_URL: https://d19nd8oh54znao.cloudfront.net
          VITE_CLOUDINARY_CLOUD: tgjvnqns

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # hashed assets and models: cache for a long time; index.html: always revalidate
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
